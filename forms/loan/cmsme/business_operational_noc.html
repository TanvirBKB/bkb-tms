<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলাদেশ কৃষি ব্যাংক - প্রত্যয়ন পত্র (Business Operational NOC)</title>
    <style>
        @page {
            size: A4;
            margin: 0.5in;
        }

        body {
            font-family: 'SolaimanLipi', Arial, sans-serif;
            font-size: 10.5pt;
            line-height: 1.6;
            color: #000;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
        }

        .a4-page {
            width: 8.27in;
            height: 11.69in;
            background: #ffffff;
            padding: 0.5in;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
            page-break-after: always;
        }

        /* Input Field Fixes: Keeps baseline tight and avoids line-height expansion */
        [contenteditable="true"] {
            display: inline !important;
            vertical-align: baseline !important;
            font-weight: bold !important;
            outline: none;
            border-bottom: none !important;
            text-decoration: underline !important;
            text-decoration-style: dotted !important;
            text-underline-offset: 4px !important;
            text-decoration-thickness: 1.5px !important;
            line-height: inherit !important;
        }

        /* Padding trick ensures empty fields show dots without breaking line height */
        [contenteditable="true"]:empty {
            padding-left: 0.25in;
            padding-right: 0.25in;
        }

        .title-container {
            text-align: center;
            margin-bottom: 45px;
        }

        .main-title {
            font-size: 15pt;
            font-weight: bold;
            text-decoration: underline;
            text-decoration-skip-ink: none;
            text-underline-offset: 4px;
            text-decoration-thickness: 1.5px;
            letter-spacing: 0.5px;
            margin: 0;
        }

        .content-block {
            text-align: justify;
            line-height: 2.2;
            text-indent: 1.5cm;
            font-size: 11pt;
            margin-bottom: 30px;
        }

        .bold {
            font-weight: bold;
        }

        .signature-row {
            display: flex;
            justify-content: space-between;
            margin-top: 45px;
            padding: 0 40px;
        }

        .signature-block {
            text-align: center;
            width: 180px;
            font-weight: bold;
        }

        .signature-line {
            border-top: 1px solid #000;
            margin-bottom: 4px;
        }

        @media print {
            body {
                background: none;
                padding: 0;
                display: block;
            }

            .a4-page {
                box-shadow: none;
                padding: 0;
                margin: 0;
                width: 100%;
                min-height: 100%;
            }
        }

        /* Input Focus and Select Fixes */
        input,
        textarea,
        select {
            -webkit-user-select: text !important;
            user-select: text !important;
            pointer-events: auto !important;
        }
    </style>

    <link rel="stylesheet" href="../../../assets/css/common.css">
</head>

<body>

    <!-- Main NOC Sheet Wrapper -->
    <div class="a4-page">

        <!-- BKB Header Layout with perfectly centered title -->
        <div class="header-container" style="position: relative; margin-bottom: 5px;">
            <!-- Absolutely position logo on the left to not disrupt center alignment -->
            <img src="../../../assets/images/bkb_logo.png" alt="BKB Logo"
                style="position: absolute; left: 0; top: 50%; transform: translateY(-50%); height: 0.7in; object-fit: contain; filter: grayscale(100%) brightness(0%); z-index: 10;">

            <!-- Center Aligned Block for Bank Name and Branch Location -->
            <div style="text-align: center; width: 100%; position: relative; z-index: 1;">
                <h1 class="bank-title" style="font-size: 16.5pt; margin: 0; text-decoration: none; line-height: 1.1;">
                    বাংলাদেশ কৃষি ব্যাংক
                </h1>

                <div style="font-size: 14pt; margin-top: 0; line-height: 1.3;">
                    <span contenteditable="true" spellcheck="false" data-placeholder="শাখার নাম"
                        data-db-field="branch_name" style="font-weight: bold;"></span> শাখা, <br>
                    <span contenteditable="true" spellcheck="false" data-placeholder="অবস্থান"
                        data-db-field="branch_location_1"></span>, <span contenteditable="true" spellcheck="false"
                        data-placeholder="জেলা" data-db-field="branch_location_2"></span>।
                </div>
            </div>

            <!-- Absolutely position contact info on the right -->
            <div style="position: absolute; right: 0; bottom: 0; text-align: right; z-index: 10;">
                <div style="font-size: 9.5pt;">
                    মোবাইলঃ <span contenteditable="true" spellcheck="false" data-placeholder="মোবাইল নম্বর"
                        data-db-field="branch_mobile" class="bangla-numbers"></span>
                </div>
                <div style="font-size: 8pt; margin-top: 2px;">
                    ইমেইলঃ <span contenteditable="true" spellcheck="false" data-placeholder="ইমেইল এড্রেস"
                        data-db-field="branch_email"></span>
                </div>
            </div>
        </div>
        <div class="divider-line" style="border-top: 1px solid #000; margin: 4px 0 15px 0; width: 100%;"></div>

        <div class="title-container">
            <h2 class="main-title">প্রতিষ্ঠান চালু থাকার বিষয়ে প্রত্যয়ন পত্র</h2>
        </div>

        <div class="content-block">
            এই মর্মে প্রত্যয়ন করা যাচ্ছে যে, এ শাখার ঋণ গ্রহীতা <span contenteditable="true"
                data-placeholder="ঋণ গ্রহীতার নাম" data-db-field="borrower_name"
                style="font-weight: bold; min-width: 2.2in;"></span>, প্রোঃ <span contenteditable="true"
                data-placeholder="প্রোপাইটারের নাম" data-db-field="proprietor_name"
                style="font-weight: bold; min-width: 2in;"></span>, ব্যবসায়িক ঠিকানা:<span contenteditable="true"
                data-placeholder="ব্যবসায়িক ঠিকানা" data-db-field="business_address" style="min-width: 2.5in;"></span>।
            ব্যবসা প্রতিষ্ঠানটি বর্তমানে সম্পূর্ণ চালু অবস্থায় রয়েছে এবং উৎপাদন কার্য অব্যাহত আছে।
        </div>

        <div class="signature-row">
            <div class="signature-block">
                <div class="signature-line"></div>
                মূল্যায়নকারী কর্মকর্তা
            </div>
            <div class="signature-block">
                <div class="signature-line"></div>
                শাখা ব্যবস্থাপক
            </div>
        </div>

    </div>

    <script>
        const enToBn = {
            '0': '০', '1': '১', '2': '২', '3': '৩', '4': '৪',
            '5': '৫', '6': '৬', '7': '৭', '8': '৮', '9': '৯'
        };

        // Automatic conversion of keyboard digits (0-9) to standard Bengali digits (০-৯) inside .bangla-numbers
        document.addEventListener('input', (e) => {
            if (e.target.hasAttribute('contenteditable') && e.target.classList.contains('bangla-numbers')) {
                let range = document.getSelection().getRangeAt(0);
                let currentPos = range.startOffset;

                let val = e.target.innerText;
                let converted = val.replace(/[0-9]/g, (match) => enToBn[match]);

                if (val !== converted) {
                    e.target.innerText = converted;

                    // Seamless caret position restoration
                    let newRange = document.createRange();
                    let selection = window.getSelection();

                    if (e.target.childNodes.length > 0) {
                        let textNode = e.target.childNodes[0];
                        newRange.setStart(textNode, Math.min(currentPos, textNode.length));
                    } else {
                        newRange.setStart(e.target, 0);
                    }
                    newRange.collapse(true);
                    selection.removeAllRanges();
                    selection.addRange(newRange);
                }
            }
        });

        // Listen for FILL command to populate branch info and auto-convert Bangla numbers
        window.addEventListener('message', function (event) {
            if (event.data && event.data.command === 'FILL') {
                const data = event.data.data;
                Object.keys(data).forEach(key => {
                    const queryStr = '#' + key + ', .' + key + ', [data-db-field="' + key + '"]';
                    const els = document.querySelectorAll(queryStr);
                    els.forEach(el => {
                        let val = data[key] || '';

                        // Automatically convert digits to Bangla if the class is present
                        if (el.classList.contains('bangla-numbers') && val) {
                            val = val.replace(/[0-9]/g, match => enToBn[match]);
                        }

                        if (el.tagName === 'SPAN' || el.tagName === 'DIV') {
                            el.innerText = val;
                        } else if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT') {
                            el.value = val;
                        }
                    });
                });
            }
        });
    </script>
    <script src="../../../assets/engines/cmsme-engine.js"></script>
</body>

</html>
