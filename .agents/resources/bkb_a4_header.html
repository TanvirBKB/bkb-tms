        <div class="header-container" style="position: relative; margin-bottom: 5px;">

            <img src="../../../assets/images/bkb_logo.png" alt="BKB Logo"

            <!-- Center Aligned Block for Bank Name and Branch Location -->
            <div style="text-align: center; width: 100%; position: relative; z-index: 1;">

                    <span contenteditable="true" spellcheck="false" data-placeholder="অবস্থান"

            <!-- Absolutely position contact info on the right -->

                </div>
                <div style="font-size: 8pt; margin-top: 2px;">
